# Run JARVIS on your own machine.
#
#   cp .env.example .env      # then fill in .env
#   docker compose up -d --build
#   open http://localhost:8080
#
# That is the whole thing. This file brings up JARVIS *and* its database,
# so nothing external is needed -- no Supabase, no Render, no account
# anywhere. Your data lives in a Docker volume on your own disk.
#
# The schema is applied automatically the first time the database starts.
# There is no migration command to remember.
#
# See docs/SELF_HOSTING.md, including how to bring your existing memories
# across from Supabase.
name: jarvis

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: jarvis
    volumes:
      # Your memories. A named volume, so `docker compose down` does NOT
      # delete them -- only `docker compose down -v` does, and that is the
      # only command here that destroys anything.
      - jarvis_data:/var/lib/postgresql/data
      # Postgres runs anything in here once, on an empty database. This is
      # the same single file the Supabase setup used, so both paths apply
      # exactly the same schema.
      - ./db/manual_setup.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    # Not published to the network by default: the app reaches it over
    # Docker's internal network, and nothing else needs to. Uncomment to
    # connect with a database tool from your own machine.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 3s
      timeout: 3s
      retries: 20

  jarvis:
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    ports:
      # 127.0.0.1 means only this machine can reach it. Change to
      # "8080:8080" to open it to your home network -- but read the HTTPS
      # section of docs/SELF_HOSTING.md first, because the login cookie
      # travels in clear text over plain http.
      - "127.0.0.1:8080:8080"
    volumes:
      # The Constitution, mounted read-only over the copy in the image.
      # Enforcement does not depend on this -- the protected paths are in
      # code, and self-development is refused at the write boundary -- but
      # a read-only mount is the honest belt-and-braces on a machine where
      # the container could otherwise write its own copy.
      - ./CONSTITUTION.md:/app/CONSTITUTION.md:ro
      # The repository itself, so JARVIS can write changes to itself.
      #
      # Without this the Build tab is dead in Docker and says so: the
      # image contains a COPY of the source and no .git (.dockerignore
      # excludes it), so repo.state() reports "not a git repository" and
      # the Plan button stays disabled. That is a page that looks
      # complete and does nothing, which is the worst shape a failure
      # can take.
      #
      # Read-write on purpose, and this is the one mount that deserves a
      # sentence about it. JARVIS creates git worktrees here and writes
      # files inside them -- that IS self-development, and it cannot
      # happen against a read-only copy. What stops it going further is
      # not this mount: app/constitution.py refuses the protected core at
      # the write boundary, app/dev/repo.py contains no push, merge,
      # rebase, reset or checkout, and every branch stays unmerged until
      # you merge it by hand.
      #
      # Branches land in your own checkout, which is the point: you read
      # them with git log and git diff like anything else.
      - ./:/repo
    # Nothing in here needs to gain privileges it did not start with, and
    # a setuid binary is the ordinary way a container escape gets from
    # "code runs" to "code runs as root". The image already drops to a
    # normal user; this stops that drop from being climbed back up.
    #
    # Deliberately NOT set here: `read_only: true`. It is the right next
    # step, but it needs a tmpfs for /tmp and a real `docker build` to
    # confirm nothing breaks -- and that has not been run yet.
    security_opt:
      - no-new-privileges:true
    # Run as you, not as the image's built-in user.
    #
    # The image drops to uid 10001, which cannot write to a checkout
    # owned by your account -- every build would fail on permissions,
    # inside git, with a message about the object store rather than about
    # ownership. Set UID and GID in .env (id -u and id -g) if yours are
    # not the usual 1000.
    #
    # This is still not root, and /app is still root-owned, so JARVIS
    # can read the code it is running and cannot rewrite it in place.
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      DATABASE_URL: postgres://jarvis:${POSTGRES_PASSWORD:-jarvis}@postgres:5432/jarvis
      PORT: "8080"
      # Real sign-in, exactly as in the cloud. DEV_MODE would switch
      # authentication off entirely and is deliberately not set here: a
      # port that is loopback-only today is one edited line from being
      # open to the house.
      DEV_MODE: "false"
      # Where the repository is, inside the container. Without it JARVIS
      # looks beside its own code, finds no history there, and reports
      # that it cannot build changes.
      REPO_PATH: "/repo"
      # Off because http://localhost is not HTTPS and the browser would
      # otherwise refuse to send the login cookie back. Set to "true" the
      # moment JARVIS sits behind a real certificate.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  jarvis_data:
