# Build config for `gcloud builds submit --config infra/cloudbuild.yaml`.
#
# Why this file exists rather than the simpler `gcloud builds submit --tag`:
# that shortcut only works when the Dockerfile sits at the root of what's
# being uploaded. Ours lives in infra/, because the repo is organised by
# purpose rather than by what Docker expects. This config keeps the build
# context at the repo root (the Dockerfile needs to copy from core/) while
# pointing explicitly at the Dockerfile's real location.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=infra/Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  # Always passed explicitly by infra/deploy.sh. This default exists only so
  # the file is valid on its own; it points at Artifact Registry because
  # Container Registry (gcr.io/<project>/...) was shut down in March 2025.
  # Note the builder image above keeps its gcr.io address -- Google-owned
  # builder images are explicitly unaffected by that shutdown.
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/jarvis/jarvis-core
