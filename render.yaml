# Render Blueprint -- deploys JARVIS from this repo with no terminal.
#
# Render reads this file when you connect the repository, so the service
# arrives pre-configured: the right Dockerfile, the right region, the
# right settings. You only fill in the two secrets, in a web form.
#
# This file lives at the repo root because that is where Render looks for
# it. Everything else stays in infra/.
services:
  - type: web
    name: jarvis-core
    runtime: docker
    # Build context is the repo root (the Dockerfile copies from core/),
    # with the Dockerfile itself in infra/.
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    region: singapore          # closest Render region to India
    plan: free
    healthCheckPath: /health
    # Deploy automatically whenever this branch is updated.
    autoDeploy: true
    branch: claude/new-session-v0jp79
    envVars:
      # --- Safety: must stay false on anything reachable from the internet ---
      - key: DEV_MODE
        value: "false"

      # --- Who is allowed in ---
      - key: OWNER_EMAIL
        value: sagarnandani99@gmail.com

      # --- Firebase (public identifiers, not secrets) ---
      - key: FIREBASE_PROJECT_ID
        value: jarvis-by-claude-a1026
      - key: FIREBASE_AUTH_DOMAIN
        value: jarvis-by-claude-a1026.firebaseapp.com
      - key: FIREBASE_API_KEY
        value: AIzaSyCezIYP0fAG-Yq55Z43W4qdwLXEKzC4g1M
      - key: FIREBASE_APP_ID
        value: "1:701562415519:web:1d377f036cd62c4c66b5aa"

      # OAuth client ID for Google's in-page sign-in button. Public, not a
      # secret. Asked for in the dashboard because it is only visible in
      # your Google Cloud console -- see docs/DEPLOYMENT.md step 4f.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # --- Staying signed in ---
      # The key used to sign login cookies. `generateValue` has Render
      # invent a strong random one and keep it, so it is never in this
      # file, never in git, and never something you have to think of.
      #
      # Keeping it is the important part: it is generated once and then
      # reused on every deploy. If it changed on each deploy, every
      # redeploy would sign you out -- which is the exact problem the
      # cookie was added to solve.
      - key: SESSION_SECRET
        generateValue: true
      # How long a sign-in lasts before you tap the button again.
      - key: SESSION_DAYS
        value: "30"

      # --- Model provider ---
      - key: LLM_PROVIDER
        value: gemini
      # Google retires model names periodically. If a message ever comes
      # back saying the model "is no longer available", the error names
      # the replacement -- change it here, or in Render's Environment tab.
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CLAUDE_MODEL
        value: claude-sonnet-5

      # --- Memory: how much of the conversation JARVIS gets to see ---
      # Set here rather than left to code defaults because this is the one
      # dial that changes what each message costs. MAX_CHARS is the real
      # limit; see docs/BUDGET.md before raising it.
      - key: MEMORY_RECALL_ENABLED
        value: "true"
      - key: MEMORY_RECALL_TURNS
        value: "20"
      - key: MEMORY_RECALL_MAX_CHARS
        value: "8000"

      # --- Budget guardrail (see docs/BUDGET.md) ---
      - key: MONTHLY_BUDGET_INR
        value: "3500"
      - key: USD_TO_INR_RATE
        value: "90"

      # --- Secrets: sync:false means Render asks YOU for these in the
      #     dashboard and never stores them in this file or in git. ---
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional. Leave blank unless you want Claude as automatic fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
