# Render Blueprint -- deploys JARVIS from this repo with no terminal.
#
# Render reads this file when you connect the repository, so the service
# arrives pre-configured: the right Dockerfile, the right region, the
# right settings. You only fill in the two secrets, in a web form.
#
# This file lives at the repo root because that is where Render looks for
# it. Everything else stays in infra/.
services:
  - type: web
    name: jarvis-core
    runtime: docker
    # Build context is the repo root (the Dockerfile copies from core/),
    # with the Dockerfile itself in infra/.
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    region: singapore          # closest Render region to India
    plan: free
    healthCheckPath: /health
    # Deploy automatically whenever this branch is updated.
    autoDeploy: true
    branch: claude/new-session-v0jp79
    envVars:
      # --- Safety: must stay false on anything reachable from the internet ---
      - key: DEV_MODE
        value: "false"

      # --- Who is allowed in ---
      - key: OWNER_EMAIL
        value: sagarnandani99@gmail.com

      # --- Firebase (public identifiers, not secrets) ---
      - key: FIREBASE_PROJECT_ID
        value: jarvis-by-claude-a1026
      - key: FIREBASE_AUTH_DOMAIN
        value: jarvis-by-claude-a1026.firebaseapp.com
      - key: FIREBASE_API_KEY
        value: AIzaSyCezIYP0fAG-Yq55Z43W4qdwLXEKzC4g1M
      - key: FIREBASE_APP_ID
        value: "1:701562415519:web:1d377f036cd62c4c66b5aa"

      # OAuth client ID for Google's in-page sign-in button. Public, not a
      # secret. Asked for in the dashboard because it is only visible in
      # your Google Cloud console -- see docs/DEPLOYMENT.md step 4f.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # --- Staying signed in ---
      # The key used to sign login cookies. `generateValue` has Render
      # invent a strong random one and keep it, so it is never in this
      # file, never in git, and never something you have to think of.
      #
      # Keeping it is the important part: it is generated once and then
      # reused on every deploy. If it changed on each deploy, every
      # redeploy would sign you out -- which is the exact problem the
      # cookie was added to solve.
      - key: SESSION_SECRET
        generateValue: true
      # How long a sign-in lasts before you tap the button again.
      - key: SESSION_DAYS
        value: "30"
      # Render serves over HTTPS, so the login cookie is marked Secure and
      # never travels in clear text. Only a plain-http run on your own
      # machine should ever set this false -- see docs/SELF_HOSTING.md.
      - key: COOKIE_SECURE
        value: "true"

      # --- Model provider ---
      - key: LLM_PROVIDER
        value: gemini
      # Google retires model names periodically. If a message ever comes
      # back saying the model "is no longer available", the error names
      # the replacement -- change it here, or in Render's Environment tab.
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # How much Gemini may "think" before answering. That thinking is
      # never shown, is billed as output, and is time you spend waiting.
      #
      # -1 means "send no setting, let the model decide", and is here
      # because gemini-3.6-flash rejected 0 with a 400 that broke every
      # message. Setting 0 is faster and cheaper where a model allows it,
      # and JARVIS now falls back by itself if refused -- so it is safe to
      # try on a different model. See docs/SPEED.md.
      # Live voice: Gemini speaking directly, rather than the browser
      # reading text aloud. This is what handles Kannada/Hindi/Marathi
      # mixed into English. Model and voice are settings so a retired
      # model name never needs a code change.
      # Voices: Kore, Fenrir, Charon, Puck, Zephyr.
      - key: LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: LIVE_VOICE
        value: Kore

      - key: GEMINI_THINKING_BUDGET
        value: "-1"
      - key: CLAUDE_MODEL
        value: claude-sonnet-5

      # --- Memory: how much of the conversation JARVIS gets to see ---
      # Set here rather than left to code defaults because this is the one
      # dial that changes what each message costs. MAX_CHARS is the real
      # limit; see docs/BUDGET.md before raising it.
      - key: MEMORY_RECALL_ENABLED
        value: "true"
      - key: MEMORY_RECALL_TURNS
        value: "20"
      - key: MEMORY_RECALL_MAX_CHARS
        value: "8000"

      # --- Long-term memory ---
      # Facts JARVIS keeps for good, looked up by relevance rather than
      # recency. Costs a second model call per message (made after the
      # reply, so it adds no waiting) -- on a free tier that is quota, not
      # money. Set ENABLED to false to turn it off.
      - key: MEMORY_FACTS_ENABLED
        value: "true"
      - key: MEMORY_FACTS_LIMIT
        value: "25"
      - key: MEMORY_FACTS_MAX_CHARS
        value: "2000"

      # --- Work that happens without you (see docs/AGENT_FOUNDATION.md) ---
      # Where "seven in the morning" is seven in the morning.
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: SCHEDULER_ENABLED
        value: "true"
      # Unattended work stops at this share of the monthly ceiling, so it
      # can never be the thing that leaves you unable to talk to JARVIS.
      - key: SCHEDULER_BUDGET_PERCENT
        value: "60"
      # The shared key for POST /v1/cron/tick, so a free pinger can wake a
      # sleeping server at the right time. Generated once and kept, like
      # SESSION_SECRET -- read it from Render's Environment tab when you
      # set the pinger up. With no key the endpoint does not exist.
      - key: CRON_KEY
        generateValue: true

      # --- Budget guardrail (see docs/BUDGET.md) ---
      - key: MONTHLY_BUDGET_INR
        value: "3500"
      - key: USD_TO_INR_RATE
        value: "90"

      # --- Secrets: sync:false means Render asks YOU for these in the
      #     dashboard and never stores them in this file or in git. ---
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional. Leave blank unless you want Claude as automatic fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
